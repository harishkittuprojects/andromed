// TYPEWRITER ANIMATION COMPONENT
function Typewriter({ words, delay = 100, deleteDelay = 50, pause = 2000, className = "" }) {
  const [currentWordIndex, setCurrentWordIndex] = useState(0);
  const [currentText, setCurrentText] = useState("");
  const [isDeleting, setIsDeleting] = useState(false);

  useEffect(() => {
    const word = words[currentWordIndex];
    let timeout;

    if (!isDeleting && currentText === word) {
      timeout = setTimeout(() => setIsDeleting(true), pause);
    } else if (isDeleting && currentText === "") {
      setIsDeleting(false);
      setCurrentWordIndex((prev) => (prev + 1) % words.length);
    } else {
      timeout = setTimeout(() => {
        setCurrentText(word.substring(0, currentText.length + (isDeleting ? -1 : 1)));
      }, isDeleting ? deleteDelay : delay);
    }

    return () => clearTimeout(timeout);
  }, [currentText, isDeleting, currentWordIndex, words, delay, deleteDelay, pause]);

  return (
    <span className={className}>
      {currentText}
      <span className="animate-pulse text-[#00E5FF] ml-0.5 font-normal select-none">|</span>
    </span>
  );
}
