// Upload Image directly to Cloudinary (with unsigned or local fallback)
async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'unsigned_uploads');
  formData.append('cloud_name', CLOUDINARY_CONFIG.cloudName);

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/upload`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (res.ok && data.secure_url) {
      return { success: true, url: data.secure_url, public_id: data.public_id };
    }
    // Fallback if unsigned preset is pending activation
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (ev) => resolve({ success: true, url: ev.target.result, isLocal: true });
      reader.readAsDataURL(file);
    });
  } catch (err) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (ev) => resolve({ success: true, url: ev.target.result, isLocal: true });
      reader.readAsDataURL(file);
    });
  }
}

// TYPEWRITER ANIMATION COMPONENT
function Typewriter({ words, delay = 100, deleteDelay = 50, pause = 2000, className = "" }) {
  const [currentWordIndex, setCurrentWordIndex] = useState(0);
  const [currentText, setCurrentText] = useState("");
  const [isDeleting, setIsDeleting] = useState(false);

  useEffect(() => {
    const word = words[currentWordIndex];
    let timeout;

    if (!isDeleting && currentText === word) {
      timeout = setTimeout(() => setIsDeleting(true), pause);
    } else if (isDeleting && currentText === "") {
      setIsDeleting(false);
      setCurrentWordIndex((prev) => (prev + 1) % words.length);
    } else {
      timeout = setTimeout(() => {
        setCurrentText(word.substring(0, currentText.length + (isDeleting ? -1 : 1)));
      }, isDeleting ? deleteDelay : delay);
    }

    return () => clearTimeout(timeout);
  }, [currentText, isDeleting, currentWordIndex, words, delay, deleteDelay, pause]);

  return (
    <span className={className}>
      {currentText}
      <span className="animate-pulse text-[#00E5FF] ml-0.5 font-normal select-none">|</span>
    </span>
  );
}

function DSALoginPage({ defaultType = 'dsa', onNavigateHome, onGoToRegister, showToast }) {
  const [partnerType, setPartnerType] = useState(defaultType);
  const [code, setCode] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [rememberMe, setRememberMe] = useState(true);
  const [isLoading, setIsLoading] = useState(false);
  const [loginAlert, setLoginAlert] = useState(null);
  const [loggedInPartner, setLoggedInPartner] = useState(null);

  const handleSwitchTab = (type) => {
    setPartnerType(type);
    setCode('');
    setLoginAlert(null);
  };

  const handleLogin = (e) => {
    e.preventDefault();
    if (!code.trim() || !password.trim()) {
      setLoginAlert({ type: 'error', text: `Please enter your valid ${partnerType === 'dsa' ? 'DSA Code' : 'Connector Code'} and password.` });
      return;
    }
    setIsLoading(true);
    setTimeout(() => {
      setIsLoading(false);
      const cleanCode = code.trim().toUpperCase();
      
      let matchedPartner = null;
      try {
        const stored = localStorage.getItem('andromeda_dsa_partners');
        if (stored) {
          const list = JSON.parse(stored);
          matchedPartner = list.find(p => (p.code || '').toUpperCase() === cleanCode);
        }
      } catch(e) {}

      if (matchedPartner) {
        if (matchedPartner.status === 'Inactive' || matchedPartner.status === 'Suspended') {
          setLoginAlert({ type: 'error', text: `Access Denied: Partner account [${cleanCode}] is currently inactive or suspended. Please contact Admin.` });
          return;
        }
        if (matchedPartner.password && matchedPartner.password !== password) {
          setLoginAlert({ type: 'error', text: `Invalid password for ${matchedPartner.type === 'dsa' ? 'DSA' : 'Connector'} Code ${cleanCode}. Please check your credentials.` });
          return;
        }
      }

      const userObj = {
        code: cleanCode,
        type: (matchedPartner && matchedPartner.type) || partnerType,
        name: (matchedPartner && matchedPartner.name) || (partnerType === 'dsa' ? 'Authorized DSA Partner' : 'Registered Connector Partner'),
        city: (matchedPartner && matchedPartner.city) || 'Nalgonda',
        commission: (matchedPartner && matchedPartner.commission) || '1.6%',
        loginTime: new Date().toLocaleTimeString()
      };
      setLoggedInPartner(userObj);
      setLoginAlert({ type: 'success', text: `Authentication verified! Welcome ${userObj.name} to Andromeda ${userObj.type === 'dsa' ? 'DSA' : 'Connector'} Portal.` });
      if (showToast) {
        showToast(`Welcome ${userObj.name}! Logged in with ${userObj.code}`);
      }
    }, 600);
  };

  const handleGoogleAuth = () => {
    setIsLoading(true);
    setTimeout(() => {
      setIsLoading(false);
      const userObj = {
        code: partnerType === 'dsa' ? 'ANDR-GOOGLE' : 'CONN-GOOGLE',
        type: partnerType,
        name: 'Google Verified Partner',
        loginTime: new Date().toLocaleTimeString()
      };
      setLoggedInPartner(userObj);
      setLoginAlert({ type: 'success', text: `Google single sign-on successful! Welcome to Andromeda ${partnerType === 'dsa' ? 'DSA' : 'Connector'} Portal.` });
      if (showToast) {
        showToast(`Signed in with Google!`);
      }
    }, 600);
  };

  return (
    <div className="w-full px-4 sm:px-8 lg:px-12 xl:px-16 space-y-6 sm:space-y-8 py-6 animate-fade-in">
      
      {/* Top Header Navigation Bar & Breadcrumb */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-200">
        <div className="flex items-center space-x-2 text-xs sm:text-sm font-bold text-slate-500">
          <button onClick={onNavigateHome} className="hover:text-[#0B4DA2] transition-colors flex items-center gap-1">
            <span>🏠 Home</span>
          </button>
          <span>/</span>
          <span className="text-[#0B4DA2] font-black">
            {partnerType === 'dsa' ? 'DSA Code Portal' : 'Connector Code Portal'}
          </span>
        </div>

        <div className="flex items-center space-x-2">
          <button
            type="button"
            onClick={() => handleSwitchTab('dsa')}
            className={`px-3.5 py-1.5 rounded-xl text-xs font-black transition-all ${
              partnerType === 'dsa'
                ? 'bg-[#0B4DA2] text-white shadow-sm'
                : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'

            DSA Mode

          <button
            type="button"

-- ANDROMEDA SUPABASE DATABASE TABLES SETUP SCRIPT

-- 1. Create Leads & Applications Table

CREATE TABLE IF NOT EXISTS public.site_settings (

);

ALTER TABLE public.site_settings ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Allow public read to site_settings" ON public.site_settings FOR SELECT USING (true);
CREATE POLICY "Allow public upsert to site_settings" ON public.site_settings FOR INSERT WITH CHECK (true);
CREATE POLICY "Allow public update to site_settings" ON public.site_settings FOR UPDATE USING (true);
`;

  // Normalize lead structure helper
  const normalizeLead = (l) => {
    const applicantName = (l.name || l.fullName || l.customerName || l.applicant_name || 'Applicant').trim();
    const rawMobile = String(l.mobile || l.mobileNumber || l.phone || l.phoneNumber || '').trim();
    const contactNo = rawMobile;
    const loanCat = l.loan_type || l.loanCategory || l.loanType || l.category || 'Personal Loan';
    const loanAmt = l.amount || (l.loanAmount ? ('Rs. ' + l.loanAmount) : 'Rs. 5,00,000');
    const locCity = (l.city || 'Nalgonda').trim();
    const leadStatus = l.status || 'New';
    const createdDate = l.created_at || new Date().toISOString();
    
    // Stable deduplication key by name + last 10 digits of phone
    const cleanDigits = rawMobile.replace(/\D/g, '').slice(-10);
    const dedupeKey = cleanDigits 
      ? `${applicantName.toLowerCase()}_${cleanDigits}` 
      : `${applicantName.toLowerCase()}_${createdDate.slice(0, 10)}`;

    return {
      ...l,
      id: l.id || dedupeKey,
      dedupeKey: dedupeKey,
      name: applicantName,
      fullName: applicantName,
      mobile: contactNo,
      mobileNumber: contactNo,
      phone: contactNo,
      loan_type: loanCat,
      loanCategory: loanCat,
      amount: loanAmt,
      city: locCity,
      status: leadStatus,
      created_at: createdDate
    };
  };

  // Load leads: Stable Deduplicated Sync (0ms Local + Seamless Cloud Merge)
  const loadLeads = () => {
    let local = [];
    try {
      local = JSON.parse(localStorage.getItem('andromeda_leads') || '[]');
    } catch(e) {}

    const map = new Map();
    local.forEach(l => {
      const norm = normalizeLead(l);
      if (!map.has(norm.dedupeKey)) {
        map.set(norm.dedupeKey, norm);
      }
    });

    const getSortedList = () => {
      return Array.from(map.values()).sort((a, b) => {
        return new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime();
      });
    };

    setLeads(getSortedList());

    // 2. Background Asynchronous Remote Supabase Sync (Non-blocking & Stable)
    if (supabaseClient) {
      supabaseClient.from('leads').select('*').order('created_at', { ascending: false })
        .then(({ data, error }) => {
          if (!error && data && data.length > 0) {
            data.forEach(l => {
              const norm = normalizeLead(l);
              map.set(norm.dedupeKey, norm);
            });
            setLeads(getSortedList());
          }
        })
        .catch(err => console.warn('Supabase background fetch notice:', err));
    }
  };

  useEffect(() => {
    if (!adminSession.isAuthenticated) return;

    // 1. Initial Load
    loadLeads();

    // 2. Multi-Tab Real-Time Sync via BroadcastChannel
    let broadcastChannel = null;
    try {
      broadcastChannel = new BroadcastChannel('andromeda_realtime_leads');
      broadcastChannel.onmessage = (event) => {
        if (event.data) {
          loadLeads();
          showToast(`🔔 Instant Alert: New lead received from ${event.data.name || 'Applicant'}!`);
        }
      };
    } catch(e) {}

    // 3. Same-Window Custom Event Listener
    const handleCustomLeadEvent = (e) => {
      loadLeads();
      if (e.detail && e.detail.name) {
        showToast(`🔔 Instant Alert: New lead received from ${e.detail.name}!`);
      }
    };
    window.addEventListener('andromeda_lead_added', handleCustomLeadEvent);

    // 4. LocalStorage Cross-Tab Storage Event Listener
    const handleStorageChange = (e) => {
      if (e.key === 'andromeda_leads') {
        loadLeads();
      }
    };
    window.addEventListener('storage', handleStorageChange);

    // 5. Supabase Realtime Postgres Changes Subscription
    let supabaseChannel = null;
    if (supabaseClient) {
      try {
        supabaseChannel = supabaseClient.channel('realtime-leads-channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, (payload) => {
            loadLeads();
            if (payload.new && payload.new.name) {
              showToast(`🔔 Live Lead Synced: ${payload.new.name} (${payload.new.loan_type || 'Loan'})`);
            }
          })
          .subscribe();
      } catch (err) {
        console.warn('Supabase realtime subscription notice:', err);
      }
    }

    // 6. Fast 2.5-second background auto-polling fallback
    const pollInterval = setInterval(() => {
      loadLeads();
    }, 2500);

    return () => {
      if (broadcastChannel) broadcastChannel.close();
      window.removeEventListener('andromeda_lead_added', handleCustomLeadEvent);
      window.removeEventListener('storage', handleStorageChange);
      if (supabaseClient && supabaseChannel) supabaseClient.removeChannel(supabaseChannel);
      clearInterval(pollInterval);
    };
  }, [adminSession.isAuthenticated]);

    const headers = ['ID', 'Date', 'Customer Name', 'Mobile Number', 'Email', 'City', 'Loan Category', 'Amount', 'Employment Type', 'Status', 'Notes'];
    const rows = leads.map(l => [
      l.id || '',

      `"${l.status || 'New'}"`,
      `"${(l.notes || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);

function getRouteFromLocation() {
  try {
    const rawHash = (window.location.hash || '').replace(/^[#/]+/, '').replace(/\/+$/, '').toLowerCase();
    const rawPath = (window.location.pathname || '').replace(/^\/+/, '').replace(/\/+$/, '').toLowerCase();
    
    if (rawHash === 'admin' || rawPath === 'admin' || rawHash.startsWith('admin') || rawPath.startsWith('admin')) {
      return 'admin';
    }
    const known = ['home', 'services', 'about', 'partner', 'dsa', 'bankers', 'charges', 'contact'];
    if (known.includes(rawHash)) return rawHash;
    if (known.includes(rawPath)) return rawPath;
    return 'home';
  } catch(e) {
    return 'home';
  }
}

function App() {
  const [currentView, setCurrentView] = useState(() => getRouteFromLocation());

  const [menuOpen, setMenuOpen] = useState(false);
  const [modalOpen, setModalOpen] = useState(false);
  const [selectedLoan, setSelectedLoan] = useState('Personal Loan');
  const [toast, setToast] = useState(null);

  // Dynamic Site Settings (loaded from Supabase / localStorage)
  const [siteSettings, setSiteSettings] = useState(() => {
    try {
      const saved = localStorage.getItem('andromeda_site_settings');
      return saved ? { ...DEFAULT_SITE_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SITE_SETTINGS;
    } catch(e) {
      return DEFAULT_SITE_SETTINGS;
    }
  });

  // Dynamic Loan Rates
  const [loanRates, setLoanRates] = useState(() => {
    try {
      const saved = localStorage.getItem('andromeda_loan_rates');
      return saved ? JSON.parse(saved) : DEFAULT_LOAN_RATES;
    } catch(e) {
      return DEFAULT_LOAN_RATES;
    }
  });

  const [formData, setFormData] = useState({
    name: '',
    mobile: '',
    email: '',
    city: 'Nalgonda',
    amount: 'Rs. 5,00,000'
  });

  // Listener for direct navigation to /admin, #/admin, #admin, /services, etc.
  useEffect(() => {
    const handleRoute = () => {
      const route = getRouteFromLocation();
      setCurrentView(route);
    };
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('popstate', handleRoute);
    return () => {
      window.removeEventListener('hashchange', handleRoute);
      window.removeEventListener('popstate', handleRoute);
    };
  }, []);

  // Listener for real-time state sync across tabs and events
  useEffect(() => {
    const handleSettingsEvent = (e) => {
      if (e.detail) {
        setSiteSettings(prev => ({ ...DEFAULT_SITE_SETTINGS, ...prev, ...e.detail }));
      }
    };
    const handleRatesEvent = (e) => {
      if (e.detail && Array.isArray(e.detail)) {
        setLoanRates(e.detail);
      }
    };
    window.addEventListener('andromeda_settings_updated', handleSettingsEvent);
    window.addEventListener('andromeda_rates_updated', handleRatesEvent);

    let bc1 = null;
    let bc2 = null;
    try {
      bc1 = new BroadcastChannel('andromeda_settings_channel');
      bc1.onmessage = (event) => {
        if (event.data) setSiteSettings(prev => ({ ...DEFAULT_SITE_SETTINGS, ...prev, ...event.data }));
      };
      bc2 = new BroadcastChannel('andromeda_rates_channel');
      bc2.onmessage = (event) => {
        if (event.data && Array.isArray(event.data)) setLoanRates(event.data);
      };
    } catch(e) {}

    return () => {
      window.removeEventListener('andromeda_settings_updated', handleSettingsEvent);
      window.removeEventListener('andromeda_rates_updated', handleRatesEvent);
      if (bc1) bc1.close();
      if (bc2) bc2.close();
    };

  // Sync with Supabase on mount
  useEffect(() => {
    async function syncSupabaseSettings() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient.from('site_settings').select('*').eq('id', 'main').single();
        if (!error && data && data.data) {
          setSiteSettings(prev => ({ ...DEFAULT_SITE_SETTINGS, ...prev, ...data.data }));
          localStorage.setItem('andromeda_site_settings', JSON.stringify(data.data));
        }
      } catch (err) {
        console.warn('Supabase initial fetch note:', err);
      }
    }
    syncSupabaseSettings();
  }, []);

  const handleUpdateSiteSettings = (newSettings) => {
    const merged = { ...DEFAULT_SITE_SETTINGS, ...newSettings };
    setSiteSettings(merged);
    localStorage.setItem('andromeda_site_settings', JSON.stringify(merged));
  };

  const handleUpdateLoanRates = (newRates) => {
    setLoanRates(newRates);
    localStorage.setItem('andromeda_loan_rates', JSON.stringify(newRates));
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 5000);
  };

  const openApply = (loanName) => {
    setSelectedLoan(loanName || 'Personal Loan');
    setModalOpen(true);
  };

  // Submit Lead to Supabase, LocalStorage & Email Request Dispatch
  const handleSubmit = async (e) => {
    e.preventDefault();
    setModalOpen(false);

    const applicantName = (formData.name || formData.fullName || 'Valued Customer').trim();
    const contactNo = (formData.mobile || formData.mobileNumber || formData.phone || '').trim();
    const applicantEmail = (formData.email || '').trim();
    const category = selectedLoan || formData.loan_type || 'Personal Loan';
    const amountVal = formData.amount || 'Rs. 5,00,000';
    const cityVal = (formData.city || 'Nalgonda').trim();

    const leadPayload = {
      id: Date.now(),
      name: applicantName,
      fullName: applicantName,
      mobile: contactNo,
      mobileNumber: contactNo,
      phone: contactNo,
      email: applicantEmail,
      city: cityVal,
      loan_type: category,
      loanCategory: category,
      loanType: category,
      amount: amountVal,
      employment_type: 'Salaried',
      status: 'New',
      notes: applicantEmail ? `Email: ${applicantEmail} | Submitted via Website Form` : 'Submitted via Website Lead Form',
      created_at: new Date().toISOString()
    };

    // 1. Save locally
    try {
      const local = JSON.parse(localStorage.getItem('andromeda_leads') || '[]');
      local.unshift(leadPayload);
      localStorage.setItem('andromeda_leads', JSON.stringify(local));
    } catch (err) {}

    // 2. Save to Supabase (Background)
    if (supabaseClient) {
      try {
        supabaseClient.from('leads').insert([{
          name: applicantName,
          mobile: contactNo,
          email: applicantEmail,
          city: cityVal,
          loan_type: category,
          amount: amountVal,
          employment_type: 'Salaried',
          status: 'New',
          notes: applicantEmail ? `Email: ${applicantEmail} | Submitted via Website Form` : 'Submitted via Website Lead Form',
          created_at: new Date().toISOString()
        }]).then(() => {}).catch(() => {});
      } catch (err) {
        console.warn('Supabase lead submit notice:', err);
      }
    }

    // 3. Automated Email Notification Dispatch to Applicant & Admin
    if (applicantEmail) {
      try {
        fetch(`https://formsubmit.co/ajax/${encodeURIComponent(siteSettings.email || 'contact@andromeda.in')}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            _subject: `New Loan Application Received: ${category} - ${applicantName}`,
            _replyto: applicantEmail,
            _cc: applicantEmail,
            "Applicant Name": applicantName,
            "Applicant Email": applicantEmail,
            "Contact Number": contactNo,
            "Loan Category": category,
            "Requested Amount": amountVal,
            "City": cityVal,
            "Date": new Date().toLocaleString(),
            "Status": "Application Acknowledged - Advisor will call shortly"
          })
        }).catch(err => console.warn('Email dispatch background note:', err));
      } catch (err) {}
    }

    // 4. Instant Real-Time Cross-Tab & Same-Window Event Broadcast
    try {
      window.dispatchEvent(new CustomEvent('andromeda_lead_added', { detail: leadPayload }));
      const bc = new BroadcastChannel('andromeda_realtime_leads');
      bc.postMessage(leadPayload);
      bc.close();
    } catch(e) {}

    showToast(`Thank you, ${applicantName}! Your application for ${category} has been received and confirmed to ${applicantEmail || contactNo}.`);
    setFormData({ name: '', mobile: '', email: '', city: 'Nalgonda', amount: 'Rs. 5,00,000' });
  };

  const scrollTo = (id) => {
    if (currentView !== 'home') {
      setCurrentView('home');
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });

      if (el) el.scrollIntoView({ behavior: 'smooth' });

            <span className="text-emerald-400 font-black text-xl">✓</span>
            <span>{toast}</span>
          </div>
        )}
        <AdminPanel
          siteSettings={siteSettings}
          onUpdateSiteSettings={handleUpdateSiteSettings}
          loanRates={loanRates}
          onUpdateLoanRates={handleUpdateLoanRates}
          onExitAdmin={() => { setCurrentView('home'); window.location.hash = ''; }}
          showToast={showToast}
        />
      </div>
    );
  }

  return (

      {toast && (
